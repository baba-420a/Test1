name: Build APK from project.zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project.zip
        id: extract
        run: |
          set -e
          if [ ! -f project.zip ]; then
            echo "project.zip not found. Upload it to the repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q project.zip -d extracted
          PUBSPEC=$(find extracted -maxdepth 6 -name pubspec.yaml -not -path '*/build/*' -not -path '*/.dart_tool/*' -not -path '*/.pub-cache/*' | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found inside project.zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            PROJECT_NAME=$(awk '/^name:/ {print $2}' pubspec.yaml | tr '[:upper:]' '[:lower:]' | tr '-' '_' || true)
            flutter create --platforms=android --project-name "${PROJECT_NAME:-my_app}" --org com.example .
          fi

      - name: Upgrade Project Gradle Settings
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          agp = "8.11.1"
          kotlin = "2.2.20"
          gradle_url_line = "distributionUrl=https" + chr(92) + "://services.gradle.org/distributions/gradle-8.14-bin.zip"

          def update_lines(path, updater):
              p = pathlib.Path(path)
              if not p.exists():
                  return
              lines = p.read_text().splitlines()
              new_lines = [updater(line) for line in lines]
              p.write_text("\n".join(new_lines) + "\n")

          def update_settings(line):
              if ("com.android.application" in line or "com.android.library" in line) and "version" in line.lower():
                  line = re.sub(r'(version\D{0,20})\d+\.\d+\.\d+', r'\g<1>' + agp, line, count=1, flags=re.IGNORECASE)
              if "org.jetbrains.kotlin.android" in line and "version" in line.lower():
                  line = re.sub(r'(version\D{0,20})\d+\.\d+\.\d+', r'\g<1>' + kotlin, line, count=1, flags=re.IGNORECASE)
              return line

          def update_buildscript(line):
              if "com.android.tools.build:gradle:" in line:
                  line = re.sub(r'com\.android\.tools\.build:gradle:\d+\.\d+\.\d+', f'com.android.tools.build:gradle:{agp}', line)
              if "kotlin_version" in line and "=" in line:
                  line = re.sub(r'(kotlin_version\s*=\s*["\'])\d+\.\d+\.\d+', r'\g<1>' + kotlin, line)
              return line

          update_lines("android/settings.gradle", update_settings)
          update_lines("android/settings.gradle.kts", update_settings)
          update_lines("android/build.gradle", update_buildscript)
          update_lines("android/build.gradle.kts", update_buildscript)

          toml = pathlib.Path("android/gradle/libs.versions.toml")
          if toml.exists():
              lines = toml.read_text().splitlines()
              new_lines = []
              for line in lines:
                  if line.strip().startswith("agp") and "=" in line:
                      line = re.sub(r'(=\s*["\'])\d+\.\d+\.\d+', r'\g<1>' + agp, line)
                  elif line.strip().startswith("kotlin") and "=" in line:
                      line = re.sub(r'(=\s*["\'])\d+\.\d+\.\d+', r'\g<1>' + kotlin, line)
                  new_lines.append(line)
              toml.write_text("\n".join(new_lines) + "\n")

          wrapper = pathlib.Path("android/gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              lines = wrapper.read_text().splitlines()
              new_lines = []
              found = False
              for line in lines:
                  if line.strip().startswith("distributionUrl"):
                      new_lines.append(gradle_url_line)
                      found = True
                  else:
                      new_lines.append(line)
              if not found:
                  new_lines.append(gradle_url_line)
              wrapper.write_text("\n".join(new_lines) + "\n")
          PY

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.dir }}
        run: flutter pub get

      - name: Patch Plugin Namespaces (Fixes on_audio_query and others)
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import os

          pub_cache = pathlib.Path(os.path.expanduser("~/.pub-cache/hosted/pub.dev"))
          if not pub_cache.exists():
              pub_cache = pathlib.Path("/home/runner/.pub-cache/hosted/pub.dev")
              
          if pub_cache.exists():
              # Scan ALL downloaded plugins for missing namespaces
              for build_gradle in pub_cache.rglob("android/build.gradle*"):
                  try:
                      content = build_gradle.read_text()
                      # If it has android { but no namespace defined
                      if re.search(r'android\s*\{', content) and "namespace " not in content and "namespace=" not in content:
                          # Try to find the correct namespace from AndroidManifest.xml
                          manifest = build_gradle.parent / "src" / "main" / "AndroidManifest.xml"
                          ns = "com.plugin.default"
                          if manifest.exists():
                              manifest_content = manifest.read_text()
                              pkg_match = re.search(r'package="([^"]+)"', manifest_content)
                              if pkg_match:
                                  ns = pkg_match.group(1)
                          
                          # Inject namespace based on Groovy or Kotlin DSL
                          if build_gradle.name.endswith(".kts"):
                              new_content = re.sub(
                                  r'(android\s*\{)',
                                  f'\\1\n    namespace = "{ns}"',
                                  content,
                                  count=1
                              )
                          else:
                              new_content = re.sub(
                                  r'(android\s*\{)',
                                  f'\\1\n    namespace "{ns}"',
                                  content,
                                  count=1
                              )
                          build_gradle.write_text(new_content)
                          print(f"Successfully patched namespace for {build_gradle} -> {ns}")
                  except Exception as e:
                      print(f"Failed to patch {build_gradle}: {e}")
          PY

      - name: Build release APK
        working-directory: ${{ steps.extract.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.extract.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
